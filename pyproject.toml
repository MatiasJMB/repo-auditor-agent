[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-auditor-agent"
version = "0.1.0"
description = "Agente CLI que clona, analiza y documenta repositorios GitHub/Git."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Repo Auditor Agent" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
repo-auditor = "repo_auditor.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
